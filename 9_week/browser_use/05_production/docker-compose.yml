version: "3.9"

services:
  agent:
    build:
      context: ..
      dockerfile: 05_production/Dockerfile
    # Секреты с хоста — НИКОГДА не хардкодим в образ
    # .env лежит в корне проекта, не внутри контейнера
    env_file:
      - ../.env
    environment:
    - USE_LOCAL_MODEL=false
    - OLLAMA_HOST=http://host.docker.internal:11434
    - AGENT_TASK=Зайди на coinmarketcap.com и верни цену токена HYPE и то, как она менялась в 2026 году
    - HTTPS_PROXY=http://squid-proxy:3128
    - HTTP_PROXY=http://squid-proxy:3128
    - NO_PROXY=localhost,127.0.0.1,::1
    volumes:
      # Только workspace доступен агенту (read-write)
      - ./workspace:/workspace:rw
    security_opt:
      # Запрет повышения привилегий
      - no-new-privileges:true
    cap_drop:
      # Убираем все capabilities (браузеру они не нужны)
      - ALL
    cap_add:
      # Нужен для Chrome sandbox внутри контейнера
      - SYS_ADMIN
    # Ограничение ресурсов
    mem_limit: 3g
    cpus: "2.0"
    shm_size: "512m"
    networks:
      - agent-net

  # Опциональный прокси для контроля исходящих запросов агента
  squid-proxy:
    image: ubuntu/squid
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge
    enable_ipv6: false
    # internal: true — раскомментировать чтобы полностью отрезать от интернета
