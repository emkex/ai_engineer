version: "3.9"

services:
  agent:
    build: .
    # Секреты с хоста — НИКОГДА не хардкодим в образ
    # .env лежит в корне проекта, не внутри контейнера
    env_file:
      - ../../.env
    environment:
      # Переключение модели без пересборки образа
      - USE_LOCAL_MODEL=false
      # Если Ollama на хосте:
      - OLLAMA_HOST=http://host.docker.internal:11434
      # Задача для агента (можно менять)
      - AGENT_TASK=Зайди на coinmarketcap.com и верни топ-5 криптовалют по капитализации
      # Прокси (опционально — раскомментировать если нужен)
      # - HTTPS_PROXY=http://squid-proxy:3128
      # - HTTP_PROXY=http://squid-proxy:3128
    volumes:
      # Только workspace доступен агенту (read-write)
      - ./workspace:/workspace:rw
    security_opt:
      # Запрет повышения привилегий
      - no-new-privileges:true
    cap_drop:
      # Убираем все capabilities (браузеру они не нужны)
      - ALL
    cap_add:
      # Нужен для Chrome sandbox внутри контейнера
      - SYS_ADMIN
    # Ограничение ресурсов
    mem_limit: 2g
    cpus: "1.0"
    networks:
      - agent-net

  # Опциональный прокси для контроля исходящих запросов агента
  # squid-proxy:
  #   image: ubuntu/squid
  #   volumes:
  #     - ./squid.conf:/etc/squid/squid.conf:ro
  #   networks:
  #     - agent-net

networks:
  agent-net:
    driver: bridge
    # Изоляция от других docker-сетей
    internal: false  # true если нужно полностью отрезать от интернета
